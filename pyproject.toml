[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openjev-rag-bench"
version = "0.1.0"
description = "Free, framework-neutral English benchmark of an open System One model (OpenJev) as a reranking and decision layer in RAG, with calibration analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenJev RAG Benchmark contributors" }]
keywords = ["rag", "reranking", "benchmark", "system-one", "openjev", "calibration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
hf = ["huggingface_hub>=0.24"]

[project.scripts]
openjev-rag = "openjev_rag_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openjev_rag_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
